<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/logo-header.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Anita's Cars" />
    <title>Anita's Car Collection</title>
  </head>
  <body>
    <div id="root">
      <div id="splash-screen" style="
        position: fixed;
        inset: 0;
        background-color: #121212;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      ">
        <style>
          @keyframes splash-pulse {
            0%, 100% { opacity: 0.9; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
          }
          .splash-logo {
            width: 75%;
            max-width: 260px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 24px rgba(255, 128, 0, 0.35));
            animation: splash-pulse 2s ease-in-out infinite;
          }
        </style>
        <img src="/logo.png" alt="Anita's Car Collection" class="splash-logo" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
